<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B.A.N.T.U. | Encoding Lab</title><style>:root{color-scheme:dark;font-family:system-ui;background:#10101c;color:#f4f1ff}body{margin:0;padding:22px;max-width:860px;margin:auto}h1{color:#bba5ff}textarea{width:100%;box-sizing:border-box;background:#1b1b2d;color:white;border:1px solid #7164a2;border-radius:12px;padding:14px;font-size:18px;min-height:100px}button{background:#4dbea9;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;margin:10px 0}section{border:1px solid #45415d;border-radius:14px;padding:16px;margin:14px 0;background:#191929}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a9e8dd}small{color:#bbb7ce}.status{color:#a9e8dd}</style></head><body><h1>B.A.N.T.U. Encoding Lab</h1><p>Binary · ASCII · NATO · Transliteration · Unicode</p><p><small>Working text representation experiment. This does not yet implement the swarm's sound physics, movement, or causal-graph traversal.</small></p><label for="source">Input text</label><textarea id="source">Synthia κόσμος</textarea><button id="run">Transform</button><p id="status" class="status" aria-live="polite"></p><div id="results"></div><script>
const nato=['Alfa','Bravo','Charlie','Delta','Echo','Foxtrot','Golf','Hotel','India','Juliett','Kilo','Lima','Mike','November','Oscar','Papa','Quebec','Romeo','Sierra','Tango','Uniform','Victor','Whiskey','X-ray','Yankee','Zulu'];
const greek={Α:'A',Β:'V',Γ:'G',Δ:'D',Ε:'E',Ζ:'Z',Η:'I',Θ:'Th',Ι:'I',Κ:'K',Λ:'L',Μ:'M',Ν:'N',Ξ:'X',Ο:'O',Π:'P',Ρ:'R',Σ:'S',Τ:'T',Υ:'Y',Φ:'F',Χ:'Ch',Ψ:'Ps',Ω:'O',α:'a',β:'v',γ:'g',δ:'d',ε:'e',ζ:'z',η:'i',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'x',ο:'o',π:'p',ρ:'r',σ:'s',ς:'s',τ:'t',υ:'y',φ:'f',χ:'ch',ψ:'ps',ω:'o'};
function transform(s){const chars=Array.from(s);const bytes=new TextEncoder().encode(s);return [
['Binary (UTF-8 bytes)',Array.from(bytes,b=>b.toString(2).padStart(8,'0')).join(' ')],
['ASCII (decimal; non-ASCII marked)',chars.map(c=>c.codePointAt(0)<=127?c.codePointAt(0):'not ASCII ('+c+')').join(' · ')],
['NATO (Latin letters only)',chars.map(c=>/^[A-Za-z]$/.test(c)?nato[c.toUpperCase().charCodeAt(0)-65]:c===' '?'[space]':'[no NATO mapping: '+c+']').join(' · ')],
['Transliteration (limited Greek → Latin demo)',Array.from(s.normalize('NFD')).map(c=>/[\u0300-\u036f]/.test(c)?'':greek[c]??c).join('')],
['Unicode code points',chars.map(c=>'U+'+c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0')).join(' ')]]}
function render(){const data=transform(document.getElementById('source').value),root=document.getElementById('results');root.replaceChildren();for(const [name,value] of data){const sec=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('pre');h.textContent=name;p.textContent=value;sec.append(h,p);root.append(sec)}document.getElementById('status').textContent='Calculated '+Array.from(document.getElementById('source').value).length+' Unicode characters.'}
document.getElementById('run').addEventListener('click',render);render();</script></body></html>
