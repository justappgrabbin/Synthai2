; Original trained Klein model, same Linux container as the Computer.
; Only the Computer's protected bridge exposes it; model binds to loopback.
[program:cynthia-klein-original]
command=/app/studio/vendor/klein-agent/.venv/bin/python /app/data/cynthia-resident/web_app.py --root /app/data/cynthia-resident --port 7860
directory=/app/data/cynthia-resident
autostart=true
autorestart=true
startsecs=8
startretries=5
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
