name: Import complete pinned LLM training foundation
on:
  push:
    branches:
      - feature/modelmaker-full-training-20261030
    paths:
      - ".github/workflows/modelmaker-upstream.yml"
      - "modelmaker/klein_registry.py"
      - "modelmaker/test_klein_registry.py"
      - "modelmaker/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modelmaker-upstream-import
  cancel-in-progress: false

jobs:
  verify-and-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Test original Synthai2 Klein structure registry
        run: python -m unittest discover -s modelmaker -p test_klein_registry.py -v
      - name: Fetch and verify complete pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=bdd480a518094ca834e05ab32131dc126b522d3d
          tmp="$(mktemp -d)"
          git init "$tmp"
          git -C "$tmp" remote add origin https://github.com/FareedKhan-dev/train-llm-from-scratch.git
          git -C "$tmp" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$tmp" checkout --detach FETCH_HEAD
          test "$(git -C "$tmp" rev-parse HEAD)" = "$UPSTREAM_SHA"
          mkdir -p modelmaker/upstream
          rsync -a --exclude=.git/ "$tmp/" modelmaker/upstream/
          test -f modelmaker/upstream/LICENSE
          test -f modelmaker/upstream/scripts/train_transformer.py
          test -f modelmaker/upstream/scripts/train_sft.py
          test -f modelmaker/upstream/scripts/train_dpo.py
          test -f modelmaker/upstream/scripts/train_grpo.py
          test -f modelmaker/upstream/src/models/modern/moe.py
          test -f modelmaker/upstream/tests/test_modern_model.py
          echo "Pinned upstream SHA: $UPSTREAM_SHA"
          echo "Vendored file count: $(find modelmaker/upstream -type f | wc -l)"
      - name: Commit vendor source only to this review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/modelmaker-full-training-20261030"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- modelmaker/upstream
          if git diff --cached --quiet; then
            echo "Pinned upstream source already present"
          else
            git commit -m "Vendor complete pinned upstream LLM trainer (MIT)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
