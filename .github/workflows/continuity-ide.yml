name: Verify SynthAi 2 IDE ↔ Continuity integration

on:
  push:
    branches:
      - feature/synthai-continuity-ide-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-existing-ide:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing SynthAi 2 dependencies
        run: npm ci --no-audit --no-fund
      - name: Diagnose legacy TypeScript without masking new-connector errors
        run: |
          set +e
          npm run check > /tmp/continuity-tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/continuity-tsc.log
          if grep -E 'client/src/components/(ContinuityIDEBridge|DeveloperPanel|UNOToolDock|PersistentAssistant)\\.tsx|client/src/lib/gptDash\\.ts' /tmp/continuity-tsc.log; then
            echo "Continuity integration introduced a TypeScript diagnostic"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Existing repo-wide TypeScript failures remain; none refer to the new connector/host."
          fi
      - name: Build existing SynthAi 2 app
        run: npm run build
      - name: Verify adapter is actually mounted in the existing editor
        run: |
          grep -q 'ContinuityIDEBridge' client/src/components/DeveloperPanel.tsx
          grep -q 'UNOToolDock' client/src/components/DeveloperPanel.tsx
          grep -q 'GPT_DASH_DIRECTIVE' client/src/components/PersistentAssistant.tsx
          grep -q '/api/companion/library' client/src/components/ContinuityIDEBridge.tsx
          test -d dist
