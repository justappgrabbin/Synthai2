name: Morph visual studio checks
on:
  pull_request:
    paths:
      - 'client/src/components/MorphVisualStudio.tsx'
      - 'client/src/components/UnifiedInterface.tsx'
      - 'server/lib/morphImageRoutes.ts'
      - 'server/index.ts'
      - 'server/routes.ts'
      - 'tests/morphVisualRoutes.test.mjs'
      - '.github/workflows/morph-visual-checks.yml'
  push:
    branches:
      - 'integration/morph-visual-video-*'
jobs:
  visual-morph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Morph API integration tests
        run: node --import tsx --test tests/morphVisualRoutes.test.mjs
      - name: Build client and server
        run: npm run build
      - name: Typecheck changed integration files (legacy project-wide errors are advisory)
        shell: bash
        run: |
          npm run check > /tmp/ts-diagnostics.txt 2>&1 || true
          if grep -E '^(client/src/components/(MorphVisualStudio|UnifiedInterface)\\.tsx|server/(lib/morphImageRoutes|routes|index)\\.ts)\\(' /tmp/ts-diagnostics.txt; then
            echo "New Morph integration contains TypeScript diagnostics."
            exit 1
          fi
          echo "No TypeScript errors in changed Morph integration files."
          echo "Existing project-wide diagnostics:"
          grep -c 'error TS' /tmp/ts-diagnostics.txt || true
