name: TRIDENT Klein real-learning acceptance
on:
  push:
    branches:
      - integration/trident-klein-neurosymbolic-20261025
    paths:
      - "synthia-server/model.py"
      - "synthia-server/train.py"
      - "synthia-server/trident_klein.py"
      - "synthia-server/trident_runtime.py"
      - "synthia-server/server.py"
      - "synthia-server/test/test_trident_klein.py"
      - ".github/workflows/trident-klein-tests.yml"
  pull_request:
    paths:
      - "synthia-server/model.py"
      - "synthia-server/train.py"
      - "synthia-server/trident_klein.py"
      - "synthia-server/trident_runtime.py"
      - "synthia-server/server.py"
      - "synthia-server/test/test_trident_klein.py"
      - ".github/workflows/trident-klein-tests.yml"
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Parse real TRIDENT and API code
        run: python -m py_compile synthia-server/model.py synthia-server/train.py synthia-server/trident_klein.py synthia-server/trident_runtime.py synthia-server/server.py
      - name: Run end-to-end Klein and checkpoint tests
        working-directory: synthia-server
        run: python -m unittest discover -s test -p "test_trident_klein.py" -v
