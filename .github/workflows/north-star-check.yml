name: North Star self-hosted integration
on:
  push:
    branches:
      - integration/autoapp-state-space-20261030
  pull_request:
    paths:
      - "server/lib/northStarRoutes.ts"
      - "client/src/pages/NorthStar.tsx"
      - "tests/northStarAdmission.test.ts"
      - ".github/workflows/north-star-check.yml"
jobs:
  verify:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Test explicit 13-field admissions
        run: npx tsx --test tests/northStarAdmission.test.ts
      - name: Typecheck existing app and integrations
        run: npm run check > type-errors.log 2>&1 || { cat type-errors.log; exit 1; }
      - name: Surface typecheck diagnostics on integration PR (push only)
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            if (fs.existsSync("type-errors.log")) {
              const out = fs.readFileSync("type-errors.log", "utf8").slice(0, 14000);
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 10, body: "CI typecheck diagnostics for commit " + context.sha.slice(0, 12) + ":\n\n```\n" + out + "\n```" });
            }
      - name: Build Synthai2
        run: npm run build
