name: Verse Commons social and game portals
on:
  pull_request:
    paths:
      - "server/lib/verseCommonsService.ts"
      - "client/src/pages/VerseCommons.tsx"
      - "client/src/App.tsx"
      - "client/src/components/GlobalNav.tsx"
      - "client/src/components/GameCreator.tsx"
      - "client/src/pages/SimlishWorld.tsx"
      - "tests/verse-commons.integration.test.ts"
      - ".github/workflows/verse-commons.yml"
permissions:
  contents: read
jobs:
  social-portals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Check social server behavior
        run: npx tsx --test tests/verse-commons.integration.test.ts
      - name: Parse social page
        run: npx esbuild client/src/pages/VerseCommons.tsx --bundle --packages=external --platform=browser --outfile=/tmp/verse-commons.js
      - name: Parse service
        run: npx esbuild server/lib/verseCommonsService.ts --bundle --packages=external --platform=node --outfile=/tmp/verse-commons-server.js
