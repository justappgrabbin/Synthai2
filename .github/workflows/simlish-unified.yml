name: Original Simlish wired into SynthAi2
on:
  push:
    branches:
      - integration/hd-morph-simlish-reconciliation-20261031
  pull_request:
    paths:
      - "scripts/stage-simlish.mjs"
      - "integrations/simlish/**"
      - "client/src/pages/SimlishWorld.tsx"
      - "client/src/lib/registerSimlishWorldApp.ts"
      - "client/src/App.tsx"
      - "client/src/components/GlobalNav.tsx"
      - "package.json"
      - ".github/workflows/simlish-unified.yml"
permissions:
  contents: read
jobs:
  simlish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install SynthAi2 dependencies
        run: npm ci
      - name: Stage pinned original Simlish sources and build SynthAi2
        run: npm run build
      - name: Verify original world, character provider and preserved studio
        run: |
          node --test client/public/simlish/world-session.test.mjs
          node --test client/public/simlish/morph-provider.test.mjs
          node --test tests/simlish-integration.test.mjs
      - name: Verify Human Design to Morph projection
        run: node --experimental-strip-types --test tests/humanDesignMorphBridge.test.mjs
      - name: Set up Java for integrated APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Package actual Simlish files inside the SynthAi2 Android app
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      - name: Verify original Simlish files exist inside the APK
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          path="android/app/build/outputs/apk/debug/app-debug.apk"
          with ZipFile(path) as apk:
              names=set(apk.namelist())
          for needed in (
              "assets/public/simlish/world.html",
              "assets/public/simlish/world-session.mjs",
              "assets/public/simlish/morph-provider.mjs",
              "assets/public/simlish/index.html",
              "assets/public/simlish/vendor/vision/wasm/vision_wasm_internal.wasm",
              "assets/public/simlish/source-manifest.json",
          ):
              if needed not in names:
                  raise SystemExit(f"APK is missing original Simlish file: {needed}")
          print("APK contains original Simlish world, studio, morph and local WASM engine.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthai2-simlish-world-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
