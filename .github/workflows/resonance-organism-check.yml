name: Resonance Organism Integration Check

on:
  push:
    branches:
      - integration/resonance-network-organism
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Studio dependencies
        run: npm ci

      - name: Compile Resonance server additions
        run: |
          npx esbuild server/lib/mountedRuntimeService.ts --platform=node --format=esm --packages=external --bundle --outfile=/tmp/resonance-runtime.mjs
          npx esbuild server/routes/resonanceNetworkRoutes.ts --platform=node --format=esm --packages=external --bundle --outfile=/tmp/resonance-routes.mjs

      - name: Production web build
        run: npm run build

      - name: Verify Resonance integration markers
        run: |
          test -f server/lib/mountedRuntimeService.ts
          test -f server/routes/resonanceNetworkRoutes.ts
          test -f client/src/pages/ResonanceNetwork.tsx
          grep -q 'registerResonanceNetworkRoutes(app)' server/routes.ts
          grep -q 'path="/resonance-network"' client/src/App.tsx
